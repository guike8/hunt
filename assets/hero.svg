    <text x="56" y="144" fill="#f1f5ec" font-size="65" font-weight="700" letter-spacing="-3"><tspan fill="#c6ff77">hunt</tspan></text>
    <text x="60" y="208" fill="#f1f5ec" font-size="35" font-weight="700" letter-spacing="-.8">Small names. Serious search.</text>
    <text x="60" y="252" fill="#9aada7" font-size="21">GitHub batches. Discord checks. Saved progress.</text>

    <path d="M60 304H694" stroke="#293a3b"/>
