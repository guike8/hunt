    <text x="345" y="342" fill="#a7b9b0" font-size="13" letter-spacing="1.3">PLATFORMS</text>
    <path d="M514 325V351" stroke="#344644"/>
    <text x="542" y="343" fill="#edf3e8" font-size="23" font-weight="700">0</text>
    <text x="567" y="342" fill="#a7b9b0" font-size="13" letter-spacing="1.3">DEPENDENCIES</text>
  </g>

  <g transform="translate(817 105)">
    <text x="0" y="-19" fill="#718c7f" font-size="12" font-family="monospace" letter-spacing="2">PATTERN / a??</text>
