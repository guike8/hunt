<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">hunt — Small names. Serious search.</title>
  <desc id="description">A dark charcoal banner with lime accents and three search cells. A read-only username finder for GitHub and Discord, with durable resume and careful availability checks.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b292b" stroke-width="1"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10191c"/>
      <stop offset="1" stop-color="#080e11"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop stop-color="#0b1215"/>
      <stop offset="0.58" stop-color="#0b1215" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0b1215" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#surface)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="20" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1279" height="419" rx="19.5" fill="none" stroke="#253438"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(58 48)" fill="none" stroke="#c6ff77" stroke-width="3.5" stroke-linecap="square">
