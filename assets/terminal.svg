<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title description">
  <title id="title">hunt — GitHub and Discord workflows</title>
  <desc id="description">Illustrative commands show GitHub batched discovery followed by verification, and direct Discord checks without a token. No live availability result is shown.</desc>
  <rect x=".5" y=".5" width="1099" height="329" rx="15" fill="#0c1316" stroke="#2b3c3e"/>
  <path d="M1 43H1099" stroke="#273638"/>
  <g fill="#526963"><circle cx="25" cy="22" r="4"/><circle cx="42" cy="22" r="4"/><circle cx="59" cy="22" r="4"/></g>
  <text x="550" y="27" text-anchor="middle" fill="#829b90" font-family="monospace" font-size="12">hunt / choose your platform / illustrative workflow</text>
  <g font-family="monospace" font-size="19">
    <text x="35" y="88" fill="#c6ff77">$ <tspan fill="#eef3ea">hunt -platform github -n 0 -find 1</tspan></text>
    <text x="59" y="127" fill="#92a89c">100-name batches → verify candidates → save progress</text>
    <path d="M35 155H1065" stroke="#233638"/>
    <text x="35" y="194" fill="#b5bcff">$ <tspan fill="#eef3ea">hunt -platform discord -length 3 -n 100 -find 1</tspan></text>
    <text x="59" y="233" fill="#92a89c">direct checks · no token · persisted cooldown</text>
  </g>
  <text x="35" y="301" fill="#71877c" font-family="monospace" font-size="12">Illustrative workflow. Availability is checked live; no names shown or claimed.</text>
</svg>
